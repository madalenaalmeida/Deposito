<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Administrador</title>
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <!-- CSS Global -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <h1>Login - Administrador</h1>
    <form id="login-form" action="/login" method="POST">
      <label for="username">Nome de Usuário:</label>
      <input type="text" id="username" name="username" required>
    
      <label for="password">Senha:</label>
      <input type="password" id="password" name="password" required>
    
      <button type="submit">Entrar</button>
    </form>
    
  </div>

  <!-- Scripts -->
  <script>
    document.getElementById('login-form').addEventListener('submit', async function(event) {
      event.preventDefault();
  
      const form = event.currentTarget;
      const formData = new URLSearchParams();
      formData.set('username', document.getElementById('username').value.trim());
      formData.set('password', document.getElementById('password').value.trim());
  
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString(),
          redirect: 'follow' // permite seguir 302 do Flask
        });
  
        if (res.ok) {
          // Se o servidor redirecionar para /admin, abrimos a tua página admin.html frontend
          // (Se estás a usar o meu backend “preservado”, a rota /admin já serve a UI de admin)
          window.location.href = '/admin';
        } else {
          alert('Nome de utilizador ou palavra-passe incorretos.');
        }
      } catch (err) {
        console.error(err);
        alert('Erro a ligar ao servidor. Verifica se o backend está a correr.');
      }
    });
  </script>

</body>
</html>
