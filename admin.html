<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel de Administração</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Excel/PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    #admin-datas .controls {
      display: flex; gap: .75rem; align-items: end; flex-wrap: wrap;
      margin: .5rem 0 1rem;
    }
    #admin-datas label { display: flex; flex-direction: column; gap: .25rem; }
    #status-datas { font-weight: 600; }
    #admin-resumo { display:block; margin: 1rem 0; font-weight: 700; text-align:center; }
    
    /* Botão vermelho em baixo */
    #exportar-e-limpar {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 2rem auto;
      background-color: #c62828;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      padding: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    #exportar-e-limpar:hover {
      background-color: #a82020;
    }
  </style>
</head>
<body>

<div class="navbar">
  <a href="index.html" class="voltar-inicio" title="Voltar ao início">
    <i class="fas fa-arrow-left"></i>
  </a>
  <span class="navbar-text">Painel de Administração</span>
</div>

<div class="container">

  <!-- TABELA DETALHADA -->
  <section id="admin-detalhados">
    <h2>Pedidos detalhados (todos)</h2>
    <div class="table-actions">
      <button class="btn-pdf" type="button" id="exp-detalhados-pdf">Exportar PDF</button>
      <button class="btn-excel" type="button" id="exp-detalhados-xlsx">Exportar Excel</button>
    </div>

    <table id="admin-detalhados-table">
      <thead>
        <tr>
          <th>Nome</th><th>Email</th><th>Ramo</th>
          <th>Produto</th><th>Tamanho</th><th>Qtd</th>
          <th>Preço unit.</th><th>Total</th><th>Data</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- AGREGADO POR RAMO -->
  <section id="admin-por-ramo">
    <h2>Pedidos por ramo (agregado)</h2>
    <div class="table-actions">
      <button class="btn-pdf" type="button" id="exp-porramo-pdf">Exportar PDF</button>
      <button class="btn-excel" type="button" id="exp-porramo-xlsx">Exportar Excel</button>
    </div>
    <table id="admin-por-ramo-table">
      <thead>
        <tr>
          <th>Ramo</th><th>Produto</th><th>Tamanho</th>
          <th>Quantidade</th><th>Preço (total)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- DETALHES POR RAMO -->
  <section id="admin-por-ramo-detalhes">
    <h2>Por ramo — detalhes</h2>
  </section>

  <!-- RESUMO -->
  <div id="admin-resumo"></div>

  <!-- PERÍODOS -->
  <section id="admin-datas">
    <h2>Períodos de Encomenda</h2>
    <div class="controls">
      <label>Data de Início
        <input type="date" id="orders-start">
      </label>
      <label>Data de Fim
        <input type="date" id="orders-end">
      </label>
      <button id="guardar-datas" type="button">Guardar</button>
      <span id="status-datas"></span>
    </div>
  </section>

</div>

<!-- BOTÃO VERMELHO EM BAIXO -->
<button id="exportar-e-limpar">Exportar Excel & Limpar Pedidos</button>

<script>
  // -------- Helpers --------
  const parseMaybeNumber = (v, fallback = 0) => {
    if (typeof v === 'number' && !isNaN(v)) return v;
    if (v == null || v === '') return fallback;
    const n = Number(String(v).replace(',', '.'));
    return isNaN(n) ? fallback : n;
  };
  const money = (n) => (Math.round(n*100)/100).toFixed(2).replace('.', ',') + '€';

  const norm = (p) => {
    const qtd = parseMaybeNumber(p.quantidade ?? p.quantity, 1);
    const unit = parseMaybeNumber(p.preco_unit ?? p.preco ?? p.price, 0);
    return {
      nome: p.nome || p.name || '',
      email: p.email || '',
      ramo: p.ramo || p.branch || '',
      produto: p.produto || p.product || '',
      tamanho: p.tamanho || p.size || '',
      quantidade: qtd,
      precoUnit: unit,
      total: unit * qtd,
      data: p.data || p.created_at || ''
    };
  };

  // -------- Config (datas) --------
  async function carregarDatas(){
    try {
      const res = await fetch('/api/config', { credentials: 'same-origin' });
      if (!res.ok) throw new Error('Falha ao ler /api/config');
      const cfg = await res.json();
      document.getElementById('orders-start').value = cfg.orders_start || '';
      document.getElementById('orders-end').value   = cfg.orders_end   || '';
    } catch (e) {
      console.error(e);
      document.getElementById('status-datas').textContent = 'Erro a carregar datas';
    }
  }

  async function guardarDatas(){
    const body = {
      orders_start: document.getElementById('orders-start').value || null,
      orders_end:   document.getElementById('orders-end').value   || null
    };
    try {
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(body)
      });
      document.getElementById('status-datas').textContent = res.ok ? 'Guardado ✅' : 'Erro ❌';
      if (res.ok) setTimeout(()=>document.getElementById('status-datas').textContent='', 2000);
    } catch (e) {
      console.error(e);
      document.getElementById('status-datas').textContent = 'Erro ❌';
    }
  }

  // -------- Pedidos --------
  async function fetchPedidosAPI() {
    const res = await fetch('/api/orders', { credentials: 'same-origin' });
    if (!res.ok) throw new Error('Falha ao carregar /api/orders');
    const arr = await res.json();
    return Array.isArray(arr) ? arr.map(norm) : [];
  }

  const agrupar = (arr, keyFn) => {
    const map = new Map();
    for (const p of arr) {
      const k = keyFn(p);
      const rec = map.get(k) || { quantidade: 0, total: 0, sample: p };
      rec.quantidade += p.quantidade || 0;
      rec.total += p.total || 0;
      map.set(k, rec);
    }
    return Array.from(map.entries()).map(([key, v]) => ({ key, ...v }));
  };

  function exportExcel(table, title) {
    const wb = XLSX.utils.table_to_book(table, {sheet: title});
    XLSX.writeFile(wb, title.replace(/\s+/g,'_') + '.xlsx');
  }

  function exportPDF(table, title) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text(title, 14, 10);
    doc.autoTable({ html: table });
    doc.save(title.replace(/\s+/g,'_') + '.pdf');
  }

  function bindExports(sectionId, tableId, titleText){
    const tbl = document.getElementById(tableId);
    document.getElementById('exp-'+sectionId.split('admin-')[1]+'-pdf')?.addEventListener('click', ()=> exportPDF(tbl, titleText));
    document.getElementById('exp-'+sectionId.split('admin-')[1]+'-xlsx')?.addEventListener('click', ()=> exportExcel(tbl, titleText));
  }

  async function render(){
    try {
      const pedidos = await fetchPedidosAPI();

      // Resumo
      const totalQtd = pedidos.reduce((s,p)=>s+(p.quantidade||0),0);
      const totalVal = pedidos.reduce((s,p)=>s+(p.total||0),0);
      const resumo = document.getElementById('admin-resumo');
      if (resumo) resumo.innerHTML =
        `<b>${pedidos.length}</b> registos | Qtde: <b>${totalQtd}</b> | Valor: <b>${money(totalVal)}</b>`;

      // Tabela detalhada
      const tbDetalhe = document.querySelector('#admin-detalhados-table tbody');
      tbDetalhe.innerHTML = '';
      pedidos.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${p.nome}</td><td>${p.email}</td><td>${p.ramo}</td>
          <td>${p.produto}</td><td>${p.tamanho}</td>
          <td>${p.quantidade||0}</td>
          <td>${money(p.precoUnit)}</td>
          <td>${money(p.total)}</td>
          <td>${p.data ? new Date(p.data).toLocaleString('pt-PT') : ''}</td>`;
        tbDetalhe.appendChild(tr);
      });

      // Agregado por ramo
      const grupos = agrupar(pedidos, p => [p.ramo, p.produto, p.tamanho].join(' | '));
      const tbRamo = document.querySelector('#admin-por-ramo-table tbody');
      tbRamo.innerHTML = '';
      grupos.forEach(g => {
        const [ramo, produto, tamanho] = g.key.split(' | ');
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${ramo}</td><td>${produto}</td><td>${tamanho}</td>
          <td>${g.quantidade}</td><td>${money(g.total)}</td>`;
        tbRamo.appendChild(tr);
      });

      bindExports('admin-detalhados','admin-detalhados-table','Pedidos detalhados');
      bindExports('admin-por-ramo','admin-por-ramo-table','Pedidos por ramo (agregado)');

    } catch (e) {
      console.error(e);
      const resumo = document.getElementById('admin-resumo');
      if (resumo) resumo.textContent = 'Erro ao carregar pedidos do servidor.';
    }
  }

  // -------- Exportar & Limpar --------
  function exportarTabelaDetalhadaParaExcel() {
    const tbl = document.getElementById('admin-detalhados-table');
    const wb = XLSX.utils.table_to_book(tbl, { sheet: 'Pedidos' });
    const hoje = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `Pedidos_${hoje}.xlsx`);
  }

  async function limparPedidosBD() {
    const res = await fetch('/api/orders/clear', {
      method: 'POST',
      credentials: 'same-origin'
    });
    if (!res.ok) throw new Error('Erro ao limpar pedidos');
  }

  async function exportarELimpar() {
    try {
      exportarTabelaDetalhadaParaExcel();
      if (!confirm('Queres apagar TODOS os pedidos da base de dados? (Já foi exportado para Excel)')) return;
      await limparPedidosBD();
      await render();
      alert('Exportado e apagado com sucesso.');
    } catch (e) {
      console.error(e);
      alert('Falhou ao exportar/limpar. Vê a consola.');
    }
  }

  // -------- Binds --------
  window.addEventListener('load', carregarDatas);
  window.addEventListener('load', render);
  document.getElementById('guardar-datas').addEventListener('click', guardarDatas);
  document.getElementById('exportar-e-limpar').addEventListener('click', exportarELimpar);
</script>

</body>
</html>
